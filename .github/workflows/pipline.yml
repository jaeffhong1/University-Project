name: Main Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.10
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black
        if [ -f PHASE_1/API_SourceCode/requirements.txt ]; then pip install -r PHASE_1/API_SourceCode/requirements.txt; fi
    - name: Lint with black
      run: |
        # make sure code has been formated with black
        black --check PHASE_1/API_SourceCode/
    - name: Run all tests
      run: |
        ./PHASE_1/run-all-tests.sh
