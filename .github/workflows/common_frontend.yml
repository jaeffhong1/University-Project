on:
  workflow_call:

jobs:
  wc_run_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up npm
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Set up yarn
        run: npm install -g yarn
        # uses: borales/actions-yarn@v2.3.0
        # with:
        #   cmd: install
      
      - name: Install packages
        run: yarn install
        working-directory: ./PHASE_2/Application_SourceCode/client
      
      - name: Ensure successful yarn build
        run: if CI='' yarn run build; then echo "yarn build passed"; else exit 1; fi
        working-directory: ./PHASE_2/Application_SourceCode/client

